<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager UI</title>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">

</head>
<body>
    <div class="container">
        <!-- Title Bar -->
        <title-bar></title-bar>

        <!-- Directory Bar -->
        <directory-bar></directory-bar>

        <!-- Content -->
        <div class="content">
            <!-- Directories/Trees Panel -->
            <directories-panel></directories-panel>

            <!-- Main Panel -->
            <div class="main-panel">
                <tool-bar></tool-bar>
                
                <folder-contents></folder-contents>
                
                <status-bar></status-bar>

            </div>
        </div>
    </div>

    <script src="sections/title-bar/title-bar.js"></script>
    <script src="/sections/directory-bar/directory-bar.js"></script>
    <script src="sections/directories-panel/directories-panel.js"></script>
    <script src="sections/toolbar/toolbar.js"></script>
    
    <!-- Added type="module" here to allow imports -->
    <script type="module" src="sections/folder-contents/folder-contents.js"></script>
    
    <script src="sections/status-bar/status-bar.js"></script>

</body>
</html>
